[project]
name = "whisper-local"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shogo Sawai", email = "shogo.sawai@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "websockets>=13",
]

[project.scripts]
whisper-local = "whisper_local:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
